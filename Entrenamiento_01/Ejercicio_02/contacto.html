    <section class = "contenedor">
      <form >
        <div class="campo"><label for="nombre">Nombre:  </label><input type="text" required></div>
        <div class="campo"><label for="email">Email:  </label><input type="email" required></div>
        <div class="campo"><label for="tel">Tel:  </label><input type="tel" pattern="[0-9]+" required></div><br>
        <div class="campo"> <label for="Mensaje">Mensaje:  </label> <textarea name="Mensaje" rows="10" cols="30" required></textarea></div>
        <br><br>
         <div class="boton"><input type="submit" value="Enviar" > <input type="reset" value="Cancelar"></div>
      </form>
      <br><br>
   
      <footer class="fijo">
         <p>Todos los Derechos reservados</p>
      </footer>
    </section>
